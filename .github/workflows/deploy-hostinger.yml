name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Inspect Hostinger FTP root
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP_TLS, all_errors

          ftp = FTP_TLS(timeout=20)
          ftp.connect(os.environ["HOST"], 21)
          ftp.login(os.environ["USERNAME"], os.environ["PASSWORD"])
          ftp.prot_p()
          print(f"FTP login directory: {ftp.pwd()}")

          paths = (
              ".",
              "public_html",
              "public_html/public_html",
              "domains/ambienta.io/public_html",
              "domains/ambienta.io/public_html/public_html",
          )
          expected = {
              "index.html",
              "index.php",
              ".htaccess",
              "assets",
              ".ftp-deploy-sync-state.json",
          }
          for path in paths:
              try:
                  ftp.cwd("/")
                  ftp.cwd(path)
                  print(f"Path available: {path} (current: {ftp.pwd()})")
                  try:
                      entries = ftp.nlst()
                      matching = sorted(expected.intersection(name.rsplit("/", 1)[-1] for name in entries))
                      print(f"Relevant entries at {path}: {matching}")
                  except all_errors:
                      print(f"Could not list relevant entries at {path}")
              except all_errors:
                  print(f"Path unavailable: {path}")

          ftp.quit()
          PY

      - name: Deploy to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./dist/
